<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starfall 三局试玩监控</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050916;color:#dceaff;font:14px system-ui,"Microsoft YaHei";padding:28px}h1{margin:0 0 8px;color:#75dcff}p{color:#8da5c8}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,a{border:1px solid #3983a5;background:#0d1b31;color:#cceeff;padding:9px 13px;text-decoration:none;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.card{border:1px solid #253b5e;background:#091225;padding:14px}.big{font:700 24px monospace;color:#fff}.ok{color:#73ffc1}.warn{color:#ffd166}table{width:100%;border-collapse:collapse;background:#081120}th,td{padding:10px;border-bottom:1px solid #1d3150;text-align:left}th{color:#75dcff}.empty{padding:36px;text-align:center;border:1px dashed #38506f;color:#7890b2}pre{white-space:pre-wrap;color:#aac4e8;max-height:300px;overflow:auto}</style>
</head>
<body>
<h1>三局试玩监控</h1>
<p>数据只保存在当前浏览器。每局请正常选择配置并游玩；死亡、胜利或暂停后按 Q 返回菜单都会结算。当前会话：<b id="session-name"></b></p>
<div class="bar"><a id="play-link" href="../?telemetry=1&session=three-run-balance&runs=3">开始 / 继续试玩</a><button id="refresh">刷新</button><button id="export">导出 JSON</button><button id="clear">清空本轮</button></div>
<div id="summary" class="cards"></div><div id="runs"></div>
<script>
const KEY='starfall.playtest.runs.v1', SESSION=new URLSearchParams(location.search).get('session')||'three-run-balance';
const esc=x=>String(x??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sec=x=>{x=Math.max(0,Number(x)||0);return `${Math.floor(x/60)}:${String(Math.round(x%60)).padStart(2,'0')}`};
function data(){try{return (JSON.parse(localStorage.getItem(KEY)||'[]')||[]).filter(x=>x.session===SESSION)}catch{return[]}}
function render(){const rows=data(),valid=rows.filter(x=>x.outcome!=='abandoned');const avg=k=>valid.length?(valid.reduce((s,x)=>s+(Number(x[k])||0),0)/valid.length).toFixed(1):'—';const wins=valid.filter(x=>x.outcome==='victory').length;document.querySelector('#summary').innerHTML=`<div class="card"><div>有效局数</div><div class="big ${valid.length>=3?'ok':'warn'}">${valid.length} / 3</div></div><div class="card"><div>胜利</div><div class="big">${wins}</div></div><div class="card"><div>平均局时</div><div class="big">${valid.length?sec(avg('duration')):'—'}</div></div><div class="card"><div>平均受伤</div><div class="big">${avg('damageTaken')}</div></div><div class="card"><div>平均最低 FPS</div><div class="big">${avg('minFps')}</div></div>`;if(!rows.length){document.querySelector('#runs').innerHTML='<div class="empty">还没有记录。点击“开始 / 继续试玩”。</div>';return}document.querySelector('#runs').innerHTML=`<table><thead><tr><th>#</th><th>结果</th><th>武器 / 流派</th><th>局时</th><th>等级</th><th>受伤 / 护盾</th><th>主要伤害</th><th>最终形态 / 技能</th><th>敌人 / 敌弹峰值</th><th>Boss 用时</th><th>FPS 平均/最低/低帧</th></tr></thead><tbody>${rows.map((r,i)=>{const bosses=Object.entries(r.bossEncounters||{}).map(([k,v])=>`${k}: ${v.fightDuration?sec(v.fightDuration):'未击败'}`).join('<br>')||'—';const topDamage=Object.entries(r.damageBySource||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`${esc(k)} ${Math.round(v)}`).join('<br>')||'—';const fp=r.finalPlayer||{};return `<tr><td>${i+1}</td><td>${esc(r.outcome)}</td><td>${esc(r.weapon)} / ${esc(r.archetype)}</td><td>${sec(r.duration)}</td><td>Lv ${esc(r.level)}</td><td>${esc(Math.round(r.damageTaken||0))} / ${esc(r.shieldBlocks||0)}</td><td>${topDamage}</td><td>${esc(fp.form)} / ${(fp.skills||[]).length}</td><td>${esc(r.peakEnemies)} / ${esc(r.peakEnemyBullets)}</td><td>${bosses}</td><td>${esc(r.averageFps)} / ${esc(r.minFps)} / ${((r.lowFrameRatio||0)*100).toFixed(1)}%</td></tr>`}).join('')}</tbody></table>`}
document.querySelector('#session-name').textContent=SESSION;document.querySelector('#play-link').href=`../?telemetry=1&session=${encodeURIComponent(SESSION)}&runs=3`;document.querySelector('#refresh').onclick=render;document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`starfall-${SESSION}.json`;a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clear').onclick=()=>{if(confirm(`清空 ${SESSION} 的记录？`)){const keep=(JSON.parse(localStorage.getItem(KEY)||'[]')||[]).filter(x=>x.session!==SESSION);localStorage.setItem(KEY,JSON.stringify(keep));localStorage.removeItem('starfall.playtest.active.v1');render()}};render();
</script>
</body></html>
